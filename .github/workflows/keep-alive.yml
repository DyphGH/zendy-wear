# Ping the Render web service every 10 minutes so the free tier does not spin down
# after ~15 min of inactivity. Set repository variable SITE_URL (e.g. https://zendy-wear.onrender.com).
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Health check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::Set repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables)"
            exit 0
          fi
          url="${SITE_URL%/}/api/health"
          echo "GET $url"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 90 "$url" || echo "000")
          echo "HTTP $code"
          cat /tmp/health.json || true
          if [ "$code" != "200" ]; then
            echo "::warning::Health check returned $code (cold start may still be in progress)"
          fi
