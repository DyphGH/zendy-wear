# Backup keep-alive for Render free tier (spins down after ~15 min idle).
# GitHub cron is often delayed — use UptimeRobot every 5 min as primary (see RENDER.md).
name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set +e
          site="${SITE_URL:-https://zendy-wear.onrender.com}"
          site="${site%/}"
          url="${site}/api/health"
          echo "GET $url"

          code="000"
          for attempt in 1 2 3 4; do
            echo "Attempt $attempt/4"
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --connect-timeout 20 --max-time 60 "$url")
            curl_exit=$?
            if [ "$curl_exit" -ne 0 ]; then
              echo "curl exit $curl_exit"
              code="000"
            fi
            echo "HTTP $code"
            if [ -f /tmp/health.json ]; then cat /tmp/health.json; fi
            if [ "$code" = "200" ]; then
              echo "OK — service is awake"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Waiting 30s (cold start?)…"
              sleep 30
            fi
          done

          echo "::notice::Health check finished with HTTP $code after 4 attempts (ping still counts as traffic)"
          exit 0
