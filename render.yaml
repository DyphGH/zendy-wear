# Render Blueprint — https://render.com/docs/blueprint-spec
# Free tier spins down after ~15 min idle; pair with .github/workflows/keep-alive.yml
# (set SITE_URL repo variable) or upgrade to a paid instance for always-on.
services:
  - type: web
    name: zendy-wear
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CLIENT_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
